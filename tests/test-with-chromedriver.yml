name: Test Chrome with ChromeDriver
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true
      - name: Assert chrome-version output is set
        env:
          CHROME_VERSION: ${{ steps.action.outputs.chrome-version }}
        run: |
          echo "chrome-version: $CHROME_VERSION"
          if [ -z "$CHROME_VERSION" ]; then
            echo "FAIL: chrome-version output is empty"
            exit 1
          fi
          echo "PASS: chrome-version=$CHROME_VERSION"
      - name: Assert chrome-path output is set and binary exists
        env:
          CHROME_PATH: ${{ steps.action.outputs.chrome-path }}
        run: |
          echo "chrome-path: $CHROME_PATH"
          if [ -z "$CHROME_PATH" ]; then
            echo "FAIL: chrome-path output is empty"
            exit 1
          fi
          if [ ! -e "$CHROME_PATH" ]; then
            echo "FAIL: chrome binary not found at $CHROME_PATH"
            exit 1
          fi
          echo "PASS: chrome-path=$CHROME_PATH"
      - name: Assert chromedriver-version output is set
        env:
          CHROMEDRIVER_VERSION: ${{ steps.action.outputs.chromedriver-version }}
        run: |
          echo "chromedriver-version: $CHROMEDRIVER_VERSION"
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "FAIL: chromedriver-version output is empty"
            exit 1
          fi
          echo "PASS: chromedriver-version=$CHROMEDRIVER_VERSION"
      - name: Assert chromedriver-path output is set and binary exists
        env:
          CHROMEDRIVER_PATH: ${{ steps.action.outputs.chromedriver-path }}
        run: |
          echo "chromedriver-path: $CHROMEDRIVER_PATH"
          if [ -z "$CHROMEDRIVER_PATH" ]; then
            echo "FAIL: chromedriver-path output is empty"
            exit 1
          fi
          if [ ! -e "$CHROMEDRIVER_PATH" ]; then
            echo "FAIL: chromedriver binary not found at $CHROMEDRIVER_PATH"
            exit 1
          fi
          echo "PASS: chromedriver-path=$CHROMEDRIVER_PATH"
      - name: Assert ChromeDriver reports version
        env:
          CHROMEDRIVER_PATH: ${{ steps.action.outputs.chromedriver-path }}
        run: |
          echo "Running: $CHROMEDRIVER_PATH --version"
          "$CHROMEDRIVER_PATH" --version 2>/dev/null || \
            echo "Note: ChromeDriver --version may not work in Docker, but binary exists"
          echo "PASS"
