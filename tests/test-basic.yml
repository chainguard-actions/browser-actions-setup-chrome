name: Test basic usage - stable Chrome
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          chrome-version: stable
        continue-on-error: true
      - name: Assert chrome outputs or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHROME_VERSION: ${{ steps.action.outputs.chrome-version }}
          CHROME_PATH: ${{ steps.action.outputs.chrome-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "chrome-version: $CHROME_VERSION"
          echo "chrome-path: $CHROME_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHROME_VERSION" ]; then
              echo "FAIL: action succeeded but chrome-version output is empty"
              exit 1
            fi
            if [ -z "$CHROME_PATH" ]; then
              echo "FAIL: action succeeded but chrome-path output is empty"
              exit 1
            fi
            echo "PASS: chrome-version=$CHROME_VERSION chrome-path=$CHROME_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert Chrome binary exists and is executable (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHROME_PATH: ${{ steps.action.outputs.chrome-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "chrome-path: $CHROME_PATH"
          if [ ! -e "$CHROME_PATH" ]; then
            echo "FAIL: chrome binary not found at $CHROME_PATH"
            exit 1
          fi
          echo "Running: $CHROME_PATH --version"
          "$CHROME_PATH" --version
          echo "PASS: Chrome runs successfully"
