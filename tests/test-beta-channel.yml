name: Test Chrome beta channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          chrome-version: beta
          install-dependencies: true
      - name: Assert chrome-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.chrome-version }}
        run: |
          echo "chrome-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: chrome-version output is empty"
            exit 1
          fi
          echo "PASS: chrome-version=$ACTUAL"
      - name: Assert chrome-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.chrome-path }}
        run: |
          echo "chrome-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: chrome-path output is empty"
            exit 1
          fi
          echo "PASS: chrome-path=$ACTUAL"
      - name: Assert Chrome binary exists at reported path
        env:
          CHROME_PATH: ${{ steps.action.outputs.chrome-path }}
        run: |
          echo "Checking binary at: $CHROME_PATH"
          if [ ! -f "$CHROME_PATH" ] && [ ! -L "$CHROME_PATH" ]; then
            echo "FAIL: Chrome binary not found at $CHROME_PATH"
            exit 1
          fi
          echo "PASS: Chrome binary exists"
